<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="КБЖУ Дневник">
  <title>КБЖУ Дневник</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-dark: #0f172a;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --dim: #64748b;
      --blue: #2563eb;
      --blue-light: #60a5fa;
      --sky: #38bdf8;
      --emerald: #10b981;
      --emerald-light: #34d399;
      --amber: #fbbf24;
      --red: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(env(safe-area-inset-bottom) + 40px);
      min-height: 100vh;
      line-height: 1.35;
    }
    button, input, select, textarea { font-family: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: none; }
    button:active { opacity: 0.8; }
    button:disabled { opacity: 0.55; pointer-events: none; }

    .container { max-width: 560px; margin: 0 auto; padding: 12px 12px 0; display: flex; flex-direction: column; gap: 12px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; }
    .hidden { display: none !important; }

    /* Шапка */
    .app-header {
      position: sticky; top: 8px; z-index: 30;
      padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
      background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.35);
    }
    .pill-btn {
      background: #334155; padding: 6px 11px; border-radius: 9px;
      font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot-red { background: #ef4444; }
    .dot-green { background: var(--emerald-light); }
    .dot-amber { background: var(--amber); }

    /* Баннер смены дня */
    .newday-banner {
      background: rgba(245, 158, 11, 0.14); border: 1px solid rgba(251, 191, 36, 0.45);
      border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px;
    }

    /* Табло калорий */
    .dash-card { padding: 14px; display: flex; flex-direction: column; gap: 11px; }
    .dash-top { display: flex; justify-content: space-between; align-items: flex-end; }
    .lbl-upper { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .val-big { font-size: 24px; font-weight: 800; margin-top: 2px; }
    .progress-track { width: 100%; height: 8px; background: #334155; border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; background: #3b82f6; transition: width 0.25s ease; }
    .progress-fill.over { background: #ef4444; }

    .macro-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
    .macro-box {
      background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(51, 65, 85, 0.7);
      padding: 8px 6px; border-radius: 10px;
    }
    .macro-lbl { font-size: 11px; color: var(--muted); }
    .macro-val { font-size: 14px; font-weight: 700; margin-top: 2px; }
    .macro-rem { font-size: 11px; margin-top: 2px; }

    /* Ввод и вкладки */
    .input-card { padding: 13px; display: flex; flex-direction: column; gap: 10px; }
    .tabs-row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .tabs-row::-webkit-scrollbar { display: none; }
    .meal-tab {
      padding: 6px 12px; border-radius: 9px; font-size: 12px; font-weight: 600;
      background: #334155; color: #cbd5e1; white-space: nowrap; flex-shrink: 0;
    }
    .meal-tab.active { background: var(--blue); color: #fff; }

    .chips-row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .chips-row::-webkit-scrollbar { display: none; }
    .chip-btn {
      background: #0f172a; border: 1px solid #475569; border-radius: 8px;
      padding: 5px 9px; font-size: 11px; color: #e2e8f0; display: inline-flex; align-items: center; gap: 5px;
      white-space: nowrap; flex-shrink: 0;
    }

    .inp-field, .textarea-field, .select-field {
      width: 100%; background: var(--card-dark); border: 1px solid var(--border);
      border-radius: 10px; padding: 9px 11px; font-size: 14px; color: #fff; outline: none;
    }
    .inp-field:focus, .textarea-field:focus, .select-field:focus { border-color: #3b82f6; }
    .textarea-field { resize: none; }

    .actions-row { display: flex; gap: 8px; }
    .btn {
      padding: 10px 12px; border-radius: 11px; font-size: 12px; font-weight: 600;
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    }
    .btn-sec { background: #334155; color: #e2e8f0; }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-emerald { background: #059669; color: #fff; }
    .btn-danger { background: rgba(127, 29, 29, 0.7); color: #fca5a5; }
    .flex-1 { flex: 1; }

    /* Секции приемов пищи */
    .meal-card { overflow: hidden; }
    .meal-hdr {
      background: rgba(15, 23, 42, 0.45); padding: 8px 12px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .item-row {
      border-top: 1px solid rgba(51, 65, 85, 0.65); padding: 9px 12px;
      display: grid; grid-template-columns: 1fr auto 24px; gap: 8px; align-items: center; cursor: pointer;
    }
    .item-row:active { background: rgba(51, 65, 85, 0.4); }
    .meal-ftr {
      background: rgba(15, 23, 42, 0.75); border-top: 1px solid rgba(51, 65, 85, 0.85);
      padding: 6px 12px; display: flex; justify-content: space-between; align-items: center;
      font-size: 11px; flex-wrap: wrap; gap: 4px;
    }

    /* Модалки */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); z-index: 50;
      display: flex; align-items: center; justify-content: center; padding: 14px;
    }
    .modal-box {
      width: 100%; max-width: 440px; max-height: 90vh; overflow-y: auto;
      padding: 16px; display: flex; flex-direction: column; gap: 13px; background: var(--card);
    }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

    /* Цвета текста */
    .t-emerald { color: var(--emerald-light); }
    .t-amber { color: var(--amber); }
    .t-red { color: var(--red); }
    .t-blue { color: var(--blue-light); }
    .t-sky { color: var(--sky); }
    .t-muted { color: var(--muted); }
    .t-dim { color: var(--dim); }
    .fw-bold { font-weight: 700; }
    .fs-xs { font-size: 12px; }
    .fs-xxs { font-size: 11px; }

    /* Тост */
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #059669; color: #fff; font-size: 12px; font-weight: 600;
      padding: 10px 16px; border-radius: 11px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); z-index: 60;
      white-space: nowrap;
    }
    details > summary { list-style: none; cursor: pointer; }
    details > summary::-webkit-details-marker { display: none; }
  </style>
</head>
<body>

  <div class="container">

    <!-- ШАПКА -->
    <header class="card app-header">
      <button onclick="openModal('goalModal')" class="pill-btn">
        <span>⚖️ <span id="hdrWeight">99.0</span> кг</span>
        <span class="t-dim">|</span>
        <span id="hdrGoalName" class="t-blue">Дефицит</span>
      </button>

      <button onclick="openModal('settingsModal')" class="pill-btn">
        <span id="keyDot" class="dot dot-red"></span>
        <span id="keyStatusText">Нет ключа</span>
        <span>⚙️</span>
      </button>
    </header>

    <!-- АВТОБАННЕР НОВОГО ДНЯ (если остались записи со вчера) -->
    <div id="newDayBanner" class="newday-banner hidden">
      <div class="fs-xs">
        📅 Остались незакрытые записи за <b id="bannerOldDate" class="t-amber"></b>. Свернуть их в архив и начать сегодняшний день?
      </div>
      <div class="actions-row">
        <button onclick="finishAndCollapseDay()" class="btn btn-emerald flex-1" style="padding:7px 10px;">✅ Свернуть в архив</button>
        <button onclick="keepOldItemsForToday()" class="btn btn-sec" style="padding:7px 10px;">Оставить</button>
      </div>
    </div>

    <!-- ГЛАВНОЕ ТАБЛО -->
    <section class="card dash-card">
      <div class="dash-top">
        <div>
          <div class="lbl-upper">Съедено за день (<span id="hdrDateLabel">сегодня</span>)</div>
          <div class="val-big">
            <span id="totKcal">0</span>
            <span style="font-size:14px; font-weight:400;" class="t-muted">/ <span id="targetKcal">1900</span> ккал</span>
          </div>
        </div>
        <div style="text-align:right;">
          <div class="lbl-upper">Осталось</div>
          <div id="remKcalBig" class="val-big t-emerald">1900 ккал</div>
        </div>
      </div>

      <div class="progress-track">
        <div id="kcalBar" class="progress-fill" style="width:0%"></div>
      </div>

      <div class="macro-grid">
        <div class="macro-box">
          <div class="macro-lbl">Белки (<span id="targetP">150</span>г)</div>
          <div class="macro-val"><span id="totP">0</span> г</div>
          <div id="remP" class="macro-rem t-emerald">ост: 150 г</div>
        </div>
        <div class="macro-box">
          <div class="macro-lbl">Жиры (<span id="targetF">75</span>г)</div>
          <div class="macro-val"><span id="totF">0</span> г</div>
          <div id="remF" class="macro-rem t-emerald">ост: 75 г</div>
        </div>
        <div class="macro-box">
          <div class="macro-lbl">Углеводы (<span id="targetC">155</span>г)</div>
          <div class="macro-val"><span id="totC">0</span> г</div>
          <div id="remC" class="macro-rem t-emerald">ост: 155 г</div>
        </div>
      </div>
    </section>

    <!-- БЛОК ВВОДА: ИИ + ПАМЯТЬ -->
    <section class="card input-card">
      <div class="tabs-row" id="mealTabs">
        <button onclick="selectMeal('breakfast')" data-meal="breakfast" class="meal-tab active">🌅 Завтрак</button>
        <button onclick="selectMeal('snack')" data-meal="snack" class="meal-tab">🍏 Перекус</button>
        <button onclick="selectMeal('lunch')" data-meal="lunch" class="meal-tab">🍲 Обед</button>
        <button onclick="selectMeal('dinner')" data-meal="dinner" class="meal-tab">🌙 Ужин</button>
      </div>

      <!-- Быстрый повтор из памяти -->
      <div id="recentChipsWrap" class="hidden" style="display:flex; flex-direction:column; gap:4px;">
        <div style="font-size:10px;" class="t-muted">🕒 Быстрый повтор (1 касание):</div>
        <div id="recentChipsList" class="chips-row"></div>
      </div>

      <textarea id="foodInput" rows="2" placeholder="Напиши, что съел, или прикрепи фото (И
